name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "Files not formatted:"
            printf '%s\n' "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/instrlint

  test-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Diagnose Windows namespace collision
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "windows_caption=$($os.Caption)" >> $env:GITHUB_OUTPUT
          "windows_version=$($os.Version)" >> $env:GITHUB_OUTPUT
          "go_version=$(go version)" >> $env:GITHUB_OUTPUT
          "checkout_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          go test -v -count=1 -run '^TestCLIScopeFor_windowsNamespaceCollision$' ./cmd/instrlint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
